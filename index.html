<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glitchy Chaos</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/addons/p5.sound.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
            color: white;
        }
        #start-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px 40px;
            font-size: 24px;
            background: #ff0055;
            border: none;
            color: #fff;
            cursor: pointer;
            z-index: 10;
        }
        #glitch-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 64px;
            text-transform: uppercase;
            letter-spacing: 8px;
            pointer-events: none;
        }
        .glitch::before,
        .glitch::after {
            content: attr(data-text);
            position: absolute;
            left: 0;
            top: 0;
        }
        .glitch::before {
            color: #f0f;
            clip-path: polygon(0 0, 100% 0, 100% 33%, 0 33%);
            animation: glitchTop 1s infinite linear alternate-reverse;
        }
        .glitch::after {
            color: #0ff;
            clip-path: polygon(0 66%, 100% 66%, 100% 100%, 0 100%);
            animation: glitchBottom 1s infinite linear alternate-reverse;
        }
        @keyframes glitchTop {
            0% {transform: translate(0, 0);}
            20% {transform: translate(-2px, -2px);}
            40% {transform: translate(2px, 2px);}
            60% {transform: translate(-2px, 2px);}
            80% {transform: translate(2px, -2px);}
            100% {transform: translate(0, 0);}
        }
        @keyframes glitchBottom {
            0% {transform: translate(0, 0);}
            20% {transform: translate(2px, 2px);}
            40% {transform: translate(-2px, -2px);}
            60% {transform: translate(2px, -2px);}
            80% {transform: translate(-2px, 2px);}
            100% {transform: translate(0, 0);}
        }
    </style>
</head>
<body>
    <button id="start-button">ENTER CHAOS</button>
    <div id="glitch-text" class="glitch" data-text="POST INTERNET CHAOS"></div>
    <script>
        let ctx, master;
        let shapes = [];

        function setup() {
            createCanvas(windowWidth, windowHeight);
            colorMode(HSB, 360, 100, 100, 255);
            noStroke();
            document.getElementById('glitch-text').innerText = document.getElementById('glitch-text').dataset.text;
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }

        function draw() {
            background(0, 20);
            for (let i = 0; i < 5; i++) {
                shapes.push({
                    x: random(width),
                    y: random(height),
                    size: random(20, 200),
                    h: random(360),
                    a: random(120, 200),
                    vx: random(-2, 2),
                    vy: random(-2, 2)
                });
            }
            shapes = shapes.slice(-400);
            shapes.forEach(s => {
                s.x += s.vx;
                s.y += s.vy;
                fill(s.h, 80, 100, s.a);
                ellipse(s.x, s.y, s.size * random(0.5, 1.5), s.size);
            });
        }

        function startSound() {
            ctx = getAudioContext();
            master = new p5.Gain();
            master.connect();
            master.amp(0.3);

            const noise = new p5.Noise('white');
            noise.amp(0.05);
            noise.start();
            noise.disconnect();
            noise.connect(master);

            setInterval(() => {
                const osc = new p5.Oscillator('sawtooth');
                osc.freq(random(80, 1200));
                osc.amp(0.3, 0.05);
                osc.start();
                osc.disconnect();
                osc.connect(master);
                osc.amp(0, 0.5, 0.1);
                setTimeout(() => osc.stop(), 700);
            }, 250);
        }

        function beginChaos() {
            userStartAudio();
            startSound();
            document.getElementById('start-button').style.display = 'none';
        }

        document.getElementById('start-button').addEventListener('click', beginChaos);
    </script>
</body>
</html>
